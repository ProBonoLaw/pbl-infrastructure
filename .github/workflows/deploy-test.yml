name: Deploy Test Infrastructure

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-test.yml"
      - ".github/workflows/deploy-production.yml"
      - "Pulumi.yaml"
      - "Pulumi.test.yaml"
      - "Pulumi.prod.yaml"
      - "index.ts"
      - "src/**"
      - "sdks/**"
      - "scripts/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Pulumi operation
        type: choice
        options:
          - preview
          - up
        default: preview
      allow_non_main:
        description: Allow a manually selected branch to access the Test stack
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pulumi-test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'updates' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test infrastructure
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Test resource graph
        run: npm run verify
        env:
          GRAPH_ENVIRONMENT_NAME: Test

      - name: Verify Production resource graph
        run: node scripts/verify-graph.js
        env:
          GRAPH_ENVIRONMENT_NAME: Production

      - name: Verify Production retirement resource graph
        run: node scripts/verify-graph.js
        env:
          GRAPH_ENVIRONMENT_NAME: Production
          GRAPH_KEEP_LEGACY_PORTAL_WEB_APP: "false"
          GRAPH_PRODUCTION_APEX_FRONT_DOOR: "true"

      - name: Set up Python for storage migration tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-storage-migration.txt

      - name: Verify storage copy behavior
        run: |
          python -m pip install -r scripts/requirements-storage-migration.txt
          python scripts/test-copy-storage-data.py

      - name: Verify Cosmos migration safety gates
        run: python scripts/test-migrate-cosmos-region.py

      - name: Verify retirement retries, leases and audit gates
        run: python scripts/test-retirement-safety.py

      - name: Verify retirement access lifecycle and rollback
        run: pwsh -NoProfile -File scripts/test-storage-retirement-safety.ps1

  preview:
    name: Preview Test stack
    needs: verify
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.allow_non_main)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_STORAGE_ACCOUNT: pbldeployments
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      FOUNDRY_PRIMARY_NAME: ${{ vars.FOUNDRY_PRIMARY_NAME }}
      FOUNDRY_DATA_LOADER_NAME: ${{ vars.FOUNDRY_DATA_LOADER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deployment values
        if: ${{ hashFiles('deployment-values.json') != '' }}
        run: node scripts/apply-deployment-values.js

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview Test Pulumi changes
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: test
          work-dir: .
          cloud-url: azblob://test
          pulumi-version: 3.265.0
          diff: true
          color: never
          suppress-outputs: true

  deploy:
    name: Update Test stack
    needs: preview
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'up' && (github.ref == 'refs/heads/main' || inputs.allow_non_main)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_STORAGE_ACCOUNT: pbldeployments
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      FOUNDRY_PRIMARY_NAME: ${{ vars.FOUNDRY_PRIMARY_NAME }}
      FOUNDRY_DATA_LOADER_NAME: ${{ vars.FOUNDRY_DATA_LOADER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deployment values
        if: ${{ hashFiles('deployment-values.json') != '' }}
        run: node scripts/apply-deployment-values.js

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply incremental Pulumi update
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: test
          work-dir: .
          cloud-url: azblob://test
          pulumi-version: 3.265.0
          diff: true
          color: never
          suppress-outputs: true
          message: GitHub Actions run ${{ github.run_id }} (${{ github.sha }})

      - name: Ensure public Test API ingress and certificate
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash scripts/ensure-test-portal-api-bootstrap.sh
